<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2027校园招聘日历</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;background:#f7f9ff;color:#172033}
.header{padding:30px 24px;background:linear-gradient(135deg,#eff6ff,#fff7ed)}
h1{margin:8px 0 4px;font-size:34px}.sub{color:#64748b}.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:#fff;color:#2563eb;font-weight:700}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 14px 34px rgba(30,64,175,.09)}
.filters{padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
select,input{height:40px;border:1px solid #dbe3f0;border-radius:12px;padding:0 10px;background:#fff}
.timeline,.calendar,.side,.mobile-important{padding:16px}
.stage-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stage{padding:12px;border-radius:16px;background:#eff6ff;border:1px solid #dbeafe;cursor:pointer}
.stage b{display:block}.stage span{font-size:12px;color:#64748b;line-height:1.45}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month{font-size:24px;font-weight:900}
button,.btn{border:0;border-radius:12px;padding:9px 12px;background:#2563eb;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}
.nav button{background:#fff;color:#172033;border:1px solid #dbe3f0}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.week div{text-align:center;color:#64748b;font-weight:800;font-size:13px}
.day{min-height:118px;border:1px solid #e7ecf5;border-radius:16px;background:#fff;padding:8px;overflow:hidden}
.muted{opacity:.35}.date{font-weight:900;margin-bottom:6px}
.event,.strip{font-size:12px;color:#fff;border-radius:10px;padding:6px 7px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;cursor:pointer}
.strip{border-radius:999px}
.cat-网申{background:#3b82f6}.cat-宣讲会{background:#f97316}.cat-笔试{background:#8b5cf6}.cat-面试{background:#10b981}.cat-体检{background:#0ea5e9}.cat-offer发放{background:#ec4899}.cat-录用签约{background:#ef4444}.cat-其他{background:#64748b}
.item{border:1px solid #e5e7eb;border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;background:#fff}.item small{color:#fff;padding:4px 8px;border-radius:999px;font-weight:800}.item h3{margin:8px 0 4px}.item p{margin:4px 0;color:#64748b;font-size:13px}
.mobile-important{display:none;margin-bottom:16px}.mobile-important h2,.timeline h2,.side h2{margin:0 0 12px}.mobile-result-hint{display:none;color:#64748b;font-size:13px;margin:0 0 10px}.quick-tabs{display:none}
.loading{padding:18px;color:#64748b;text-align:center}.error{padding:16px;border:1px solid #fecaca;background:#fff1f2;color:#be123c;border-radius:16px;margin-bottom:16px;line-height:1.6}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.48);align-items:center;justify-content:center;padding:18px;z-index:99}.modal.show{display:flex}.modal-box{background:#fff;width:min(680px,96vw);border-radius:24px;overflow:hidden}
.modal-top{padding:22px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;position:relative}.close{position:absolute;right:18px;top:12px;font-size:26px;cursor:pointer}.modal-body{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:10px}.info small{display:block;color:#64748b}
.debug{font-size:12px;color:#64748b;padding:8px 14px}
@media(max-width:900px){.wrap{display:block;padding:12px}.side{margin-top:12px}.stage-list{grid-template-columns:1fr 1fr}}
@media(max-width:640px){
body{background:#f6f8ff}.header{padding:14px 12px 12px;text-align:center;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);box-shadow:0 8px 20px rgba(15,23,42,.06)}
h1{font-size:21px}.sub{font-size:12px;margin:0}.badge{font-size:11px}.wrap{padding:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;position:sticky;top:82px;z-index:18;background:#fff}.filters input{grid-column:1/-1}
select,input{width:100%;height:38px;font-size:13px}.mobile-result-hint{display:block}.quick-tabs{display:flex;gap:8px;overflow:auto;padding:0 2px 10px}.quick-tabs button{flex:0 0 auto;background:#fff;color:#2563eb;border:1px solid #bfdbfe;border-radius:999px;padding:8px 12px;font-size:12px}
.mobile-important{display:block}.desktop-side{display:none}.timeline{margin-bottom:10px;padding:14px}.stage-list{grid-template-columns:1fr;gap:8px}.stage{padding:12px;border-radius:16px}
.calendar{padding:14px}.week{display:none}.days{display:block}.day{display:grid;grid-template-columns:46px 1fr;gap:8px;min-height:auto;margin-bottom:8px;padding:10px;border-radius:16px;overflow:visible}.day.muted{display:none}.date{width:38px;height:38px;border-radius:12px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;margin:0;font-size:18px}.event,.strip{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;font-size:13px;line-height:1.35;padding:8px 10px;margin:0 0 6px;border-radius:12px}
.cal-head{position:sticky;top:202px;z-index:17;background:#fff;padding-bottom:8px}.month{font-size:19px}.nav button{padding:8px 10px;font-size:12px}
.modal{align-items:flex-end;padding:0}.modal-box{width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0}.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="header">
  <span class="badge">2027 CAMPUS RECRUITMENT</span>
  <h1>2027校园招聘日历</h1>
  <p class="sub">数据来自 events.json，替换 JSON 后日程自动更新</p>
</header>

<main class="wrap">
<section>
<div id="errorBox"></div>

<div class="card filters">
  <select id="cat">
    <option>全部类型</option><option>网申</option><option>宣讲会</option><option>笔试</option><option>面试</option><option>体检</option><option>offer发放</option><option>录用签约</option><option>其他</option>
  </select>
  <select id="city"><option>全部城市</option></select>
  <select id="school"><option>全部学校</option></select>
  <input id="kw" placeholder="搜索学校 / 地点 / 事项">
</div>

<div class="mobile-result-hint" id="resultHint">正在加载日程数据...</div>
<div class="quick-tabs">
  <button onclick="setCat('全部类型')">全部</button>
  <button onclick="setCat('网申')">网申</button>
  <button onclick="setCat('宣讲会')">宣讲</button>
  <button onclick="setCat('笔试')">笔试</button>
  <button onclick="setCat('面试')">面试</button>
</div>

<div class="card timeline">
  <h2>校招阶段时间段</h2>
  <div class="stage-list" id="stages"><div class="loading">正在加载...</div></div>
</div>

<div class="card mobile-important">
  <h2>本月重点提醒</h2>
  <div id="mobileImportant"><div class="loading">正在加载...</div></div>
</div>

<div class="card calendar">
  <div class="cal-head">
    <div class="month" id="month">正在加载</div>
    <div class="nav"><button onclick="move(-1)">上一月</button><button onclick="move(1)">下一月</button></div>
  </div>
  <div class="week"><div>周日</div><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div></div>
  <div class="days" id="days"><div class="loading">正在加载...</div></div>
</div>
</section>

<aside class="card side desktop-side">
  <h2>本月重点提醒</h2>
  <p style="color:#64748b">点击事项查看详情。</p>
  <div id="important"><div class="loading">正在加载...</div></div>
</aside>
</main>

<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-box">
    <div class="modal-top"><span class="close" onclick="closeModal()">×</span><small id="mcat"></small><h2 id="mtitle"></h2><p id="mtime"></p></div>
    <div class="modal-body"><div class="grid" id="minfo"></div><p id="mdesc"></p><p id="mreminder"></p><a id="mlink" class="btn" target="_blank">查看 / 投递</a></div>
  </div>
</div>

<script>
let EVENTS = [];
let current = new Date(2026, 8, 1);

function $(id){return document.getElementById(id)}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fd(s){if(!s)return "";let a=String(s).split("-");return a[0]+"."+Number(a[1])+"."+Number(a[2])}
function inr(day,s,e){return day>=s&&day<=e}
function setCat(v){$("cat").value=v;render()}
function safeText(v){return (v===undefined||v===null) ? "" : String(v)}
function catClass(category){return "cat-" + (category || "其他")}

async function loadEvents(){
  const jsonUrl = new URL("events.json", window.location.href);
  jsonUrl.searchParams.set("t", Date.now());

  try{
    const response = await fetch(jsonUrl.toString(), { cache: "no-store" });
    if(!response.ok){throw new Error("HTTP " + response.status + "，未找到 events.json 或无法读取")}
    const data = await response.json();
    if(!Array.isArray(data)){throw new Error("events.json 最外层必须是数组 []")}
    EVENTS = data.map(normalizeEvent).filter(Boolean);

    if(EVENTS.length === 0){
      throw new Error("events.json 已读取，但没有有效事项。每条至少需要 title 和 startDate。");
    }

    init();
  }catch(error){
    console.error("日程数据加载失败：", error);
    $("errorBox").innerHTML =
      '<div class="error"><b>日程数据加载失败。</b><br>' +
      '请确认 GitHub 仓库根目录同时存在 <b>index.html</b> 和 <b>events.json</b>。<br>' +
      '当前尝试读取：<code>' + jsonUrl.toString() + '</code><br>' +
      '错误信息：' + error.message + '</div>';
    $("resultHint").textContent = "日程数据加载失败，请检查 events.json。";
    $("stages").innerHTML = '<p style="color:#94a3b8">暂无数据</p>';
    $("days").innerHTML = '<div class="loading">暂无数据</div>';
    $("important").innerHTML = '<p style="color:#94a3b8">暂无数据</p>';
    $("mobileImportant").innerHTML = '<p style="color:#94a3b8">暂无数据</p>';
  }
}

function normalizeEvent(e){
  if(!e || !e.title || !e.startDate) return null;
  const start = safeText(e.startDate).slice(0,10);
  const end = safeText(e.endDate || e.startDate).slice(0,10);
  return {
    id: e.id || ("event-" + start + "-" + e.title),
    title: safeText(e.title),
    type: safeText(e.type) || (start !== end ? "阶段" : "单日事项"),
    category: safeText(e.category) || "其他",
    startDate: start,
    endDate: end,
    startTime: safeText(e.startTime),
    endTime: safeText(e.endTime),
    school: safeText(e.school),
    city: safeText(e.city),
    location: safeText(e.location),
    description: safeText(e.description),
    reminder: safeText(e.reminder),
    link: safeText(e.link) || "#",
    important: safeText(e.important) || "否"
  };
}

function filtered(){
  let cat=$("cat").value,city=$("city").value,school=$("school").value,kw=$("kw").value.trim().toLowerCase();
  return EVENTS.filter(e=>
    (cat==="全部类型"||e.category===cat) &&
    (city==="全部城市"||e.city===city) &&
    (school==="全部学校"||e.school===school) &&
    (!kw||[e.title,e.school,e.city,e.location,e.description,e.reminder].join(" ").toLowerCase().includes(kw))
  );
}

function init(){
  fillSelect("city",[...new Set(EVENTS.map(e=>e.city).filter(Boolean))]);
  fillSelect("school",[...new Set(EVENTS.map(e=>e.school).filter(Boolean))]);
  ["cat","city","school","kw"].forEach(id=>$(id).addEventListener("input",render));

  const first = EVENTS.slice().sort((a,b)=>a.startDate.localeCompare(b.startDate))[0];
  if(first && first.startDate){
    const p=first.startDate.split("-");
    current=new Date(Number(p[0]),Number(p[1])-1,1);
  }

  $("errorBox").innerHTML = "";
  render();
}

function fillSelect(id,values){
  const select=$(id);
  while(select.options.length>1)select.remove(1);
  values.forEach(v=>{let o=document.createElement("option");o.textContent=v;select.appendChild(o)});
}

function render(){renderStages();renderCalendar();renderImportant();renderHint()}
function renderHint(){let n=filtered().length;$("resultHint").textContent="当前筛选结果："+n+" 个事项 / 阶段。"}

function renderStages(){
  let el=$("stages");el.innerHTML="";
  filtered().filter(e=>e.type==="阶段").forEach(e=>{
    let d=document.createElement("div");
    d.className="stage";
    d.innerHTML="<b>"+e.title+"</b><span>"+fd(e.startDate)+" — "+fd(e.endDate)+"<br>"+(e.description||e.location||"点击查看详情")+"</span>";
    d.onclick=()=>openModal(e);
    el.appendChild(d);
  });
  if(!el.innerHTML)el.innerHTML='<p style="color:#94a3b8">暂无匹配阶段</p>';
}

function renderCalendar(){
  let y=current.getFullYear(),m=current.getMonth();
  $("month").textContent=y+"年"+(m+1)+"月";
  let start=new Date(y,m,1-new Date(y,m,1).getDay()),el=$("days");
  el.innerHTML="";
  let evs=filtered();

  for(let i=0;i<42;i++){
    let d=new Date(start);d.setDate(start.getDate()+i);
    let day=ds(d);
    let dayEvents=evs.filter(e=>inr(day,e.startDate,e.endDate));
    let div=document.createElement("div");
    div.className="day"+(d.getMonth()!=m?" muted":"");
    div.innerHTML='<div class="date">'+d.getDate()+"</div>";
    let c=document.createElement("div");

    if(dayEvents.length===0){
      c.innerHTML='<span style="color:#cbd5e1;font-size:12px">暂无事项</span>';
    }else{
      dayEvents.forEach(e=>{
        let item=document.createElement("div");
        item.className=(e.type==="阶段"?"strip":"event")+" "+catClass(e.category);
        item.textContent=e.type==="阶段" ? e.title : ((e.startTime?e.startTime+" ":"") + e.title);
        item.onclick=()=>openModal(e);
        c.appendChild(item);
      });
    }

    div.appendChild(c);
    el.appendChild(div);
  }
}

function filteredImportant(){
  let y=current.getFullYear(),m=current.getMonth(),s=ds(new Date(y,m,1)),e=ds(new Date(y,m+1,0));
  return filtered().filter(x=>x.important==="是" && !(x.endDate<s || x.startDate>e));
}

function importantHTML(){
  let list=filteredImportant();
  if(list.length===0)return '<p style="color:#94a3b8">暂无重点提醒</p>';
  return list.map((x,i)=>
    '<div class="item" onclick="openModal(filteredImportant()['+i+'])">' +
    '<small class="'+catClass(x.category)+'">'+x.category+'</small>' +
    '<h3>'+x.title+'</h3>' +
    '<p>'+fd(x.startDate)+(x.startDate!==x.endDate?' — '+fd(x.endDate):' '+(x.startTime||''))+'</p>' +
    '<p>'+(x.location||x.school||x.city||'')+'</p>' +
    '</div>'
  ).join("");
}

function renderImportant(){
  $("important").innerHTML=importantHTML();
  $("mobileImportant").innerHTML=importantHTML();
}

function openModal(e){
  $("modal").classList.add("show");
  $("mcat").textContent=e.category;
  $("mtitle").textContent=e.title;
  $("mtime").textContent=e.startDate===e.endDate ? fd(e.startDate)+" "+(e.startTime||"")+(e.endTime?" — "+e.endTime:"") : fd(e.startDate)+" — "+fd(e.endDate);
  $("minfo").innerHTML=[
    ["事项类型",e.type],["学校",e.school],["城市",e.city],["地点",e.location]
  ].map(x=>'<div class="info"><small>'+x[0]+'</small><b>'+(x[1]||"未填写")+'</b></div>').join("");
  $("mdesc").textContent=e.description||"暂无说明";
  $("mreminder").innerHTML="<b>提醒：</b>"+(e.reminder||"暂无提醒");
  $("mlink").href=e.link||"#";
}

function closeModal(){$("modal").classList.remove("show")}
function move(n){current.setMonth(current.getMonth()+n);render()}

loadEvents();
</script>
</body>
</html>
